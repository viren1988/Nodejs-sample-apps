<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K8s Sample App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Welcome to Kubernetes Sample App</h1>
    <div class="environment-banner" id="env-banner"></div>
    <div class="info-card">
      <h2>Environment Information</h2>
      <div id="environment-info">
        <p>Loading environment data...</p>
      </div>
    </div>
    <div class="info-card">
      <h2>System Information</h2>
      <div id="system-info">
        <p>Loading system data...</p>
      </div>
    </div>
    <div class="features">
      <h2>Feature Flags</h2>
      <div id="feature-flags"></div>
    </div>
  </div>
  <script>
    fetch('/api/environment')
      .then(response => response.json())
      .then(data => {
        // Set environment banner
        const envBanner = document.getElementById('env-banner');
        envBanner.textContent = `Environment: ${data.environment.toUpperCase()}`;
        envBanner.className = `environment-banner ${data.environment.toLowerCase()}`;
        // Set environment info
        const envInfo = document.getElementById('environment-info');
        envInfo.innerHTML = `
          <p><strong>Version:</strong> ${data.version}</p>
          <p><strong>Last Updated:</strong> ${new Date(data.timestamp).toLocaleString()}</p>
        `;
        // Set system info
        const sysInfo = document.getElementById('system-info');
        sysInfo.innerHTML = `
          <p><strong>Hostname:</strong> ${data.hostname}</p>
        `;
        // Set feature flags
        const features = document.getElementById('feature-flags');
        features.innerHTML = `
          <p><strong>Canary:</strong> ${data.features.canary ? ':white_check_mark: Enabled' : ':x: Disabled'}</p>
          <p><strong>New UI:</strong> ${data.features.newUI ? ':white_check_mark: Enabled' : ':x: Disabled'}</p>
        `;
      })
      .catch(error => {
        console.error('Error fetching environment data:', error);
      });
  </script>
</body>
</html>
